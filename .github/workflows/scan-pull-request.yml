name: Scan Pull Request (centralized)
# Scans a pull request in ANOTHER repository in this organization.
#
# Frogbot is given only the target repo and the PR number; it calls
# GetPullRequestByID to resolve the source and target owner/repo/branch, then
# downloads both branches itself via the VCS API. The target repository needs no
# workflow file and this workflow never checks out its own source.
#
# We invoke the binary directly rather than using jfrog/frogbot@v3, because the
# action's setFrogbotEnv() unconditionally overwrites JF_GIT_OWNER, JF_GIT_REPO
# and JF_GIT_PULL_REQUEST_ID with the *running* repo's context. See README.
#
# Frogbot posts PR comments but does not create any check run or commit status,
# so centrally there is nothing a merge gate could point at. This workflow adds
# that: a commit status on the PR head, posted "pending" up front and ALWAYS
# resolved, so a required status check can never hang forever.
#
# Production: XSC receives the `pull_request` App webhook and fires
# `repository_dispatch` type `jfrog-scan-pull-request` with client_payload
# { target_repo, pr_number }. Manual workflow_dispatch remains for POC testing.
on:
  repository_dispatch:
    types: [jfrog-scan-pull-request]
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository containing the pull request (name only)"
        required: true
        type: string
      pr_number:
        description: "Pull request number"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # One in-flight scan per target PR; a new push supersedes the previous run.
  group: pr-scan-${{ github.event.client_payload.target_repo || inputs.target_repo }}-${{ github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: true
env:
  STATUS_CONTEXT: "JFrog Frogbot / scan-pull-request"
  TARGET_REPO: ${{ github.event.client_payload.target_repo || inputs.target_repo }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
jobs:
  scan:
    runs-on: ubuntu-latest
    name: "scan-pull-request: ${{ github.event.client_payload.target_repo || inputs.target_repo }}#${{ github.event.client_payload.pr_number || inputs.pr_number }}"
    steps:
      - name: Resolve PR head and mark status pending
        id: pr
        env:
          GH_TOKEN: ${{ secrets.JF_GIT_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(gh api "/repos/${GITHUB_REPOSITORY_OWNER}/${TARGET_REPO}/pulls/${PR_NUMBER}" --jq .head.sha)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Target PR head: ${sha}"
          gh api -X POST "/repos/${GITHUB_REPOSITORY_OWNER}/${TARGET_REPO}/statuses/${sha}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f description="Scanning dependencies..." \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Frogbot
        run: |
          set -euo pipefail
          curl -fL 'https://releases.jfrog.io/artifactory/frogbot/v3/%5BRELEASE%5D/frogbot-linux-amd64/frogbot' -o /usr/local/bin/frogbot
          chmod +x /usr/local/bin/frogbot
          frogbot --version
      - name: Scan target pull request
        id: scan
        continue-on-error: true
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
          JF_GIT_PROVIDER: github
          JF_GIT_API_ENDPOINT: https://api.github.com
          JF_GIT_TOKEN: ${{ secrets.JF_GIT_TOKEN }}
          JF_GIT_OWNER: ${{ github.repository_owner }}
          JF_GIT_REPO: ${{ env.TARGET_REPO }}
          JF_GIT_PULL_REQUEST_ID: ${{ env.PR_NUMBER }}
        run: frogbot scan-pull-request
      # Runs even if the scan step failed, was cancelled, or the runner died
      # mid-way. A required status check that is never resolved blocks the PR
      # permanently, so this must be unconditional.
      - name: Publish result to the target PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.JF_GIT_TOKEN }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          case "${SCAN_OUTCOME}" in
            success)   state=success; desc="No new security issues found" ;;
            failure)   state=failure; desc="Frogbot found new security issues - see PR comments" ;;
            *)         state=error;   desc="Scan did not complete (${SCAN_OUTCOME})" ;;
          esac
          gh api -X POST "/repos/${GITHUB_REPOSITORY_OWNER}/${TARGET_REPO}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state="${state}" \
            -f context="${STATUS_CONTEXT}" \
            -f description="${desc}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "Published ${state}: ${desc}"
