name: Scan Repository (centralized)

# Scans OTHER repositories in this organization. Nothing is installed in them.
#
# Frogbot's Go core takes the repo it should act on entirely from JF_GIT_* and
# clones the target itself, so target repos need no workflow file and this
# workflow never checks out its own source.
#
# We invoke the binary directly rather than using jfrog/frogbot@v3, because the
# action's setFrogbotEnv() unconditionally overwrites JF_GIT_OWNER, JF_GIT_REPO
# and JF_GIT_PULL_REQUEST_ID with the *running* repo's context. See README.
#
# NOTE: `scan-repository` also opens fix pull requests, so this is not a
# scan-only path — it runs package managers and does depend on the build
# environment.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository to scan (name only). Leave empty to scan every repository in the org."
        required: false
        type: string
      branch:
        description: "Branch to scan"
        required: false
        default: main
        type: string
  schedule:
    # Daily fan-out across the whole org.
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Resolve target repositories
        id: list
        env:
          GH_TOKEN: ${{ secrets.JF_GIT_TOKEN }}
          SINGLE_TARGET: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          if [ -n "${SINGLE_TARGET}" ]; then
            targets=$(jq -cn --arg r "${SINGLE_TARGET}" '[$r]')
          else
            targets=$(gh api --paginate "/orgs/${GITHUB_REPOSITORY_OWNER}/repos" \
              --jq '.[] | select(.archived == false) | .name' \
              | grep -vxF "${GITHUB_REPOSITORY#*/}" \
              | jq -Rcn '[inputs]')
          fi
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "Resolved targets: ${targets}"

  scan:
    needs: discover
    if: needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    name: "scan-repository: ${{ matrix.target }}"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Frogbot
        run: |
          set -euo pipefail
          curl -fL 'https://releases.jfrog.io/artifactory/frogbot/v3/%5BRELEASE%5D/frogbot-linux-amd64/frogbot' -o /usr/local/bin/frogbot
          chmod +x /usr/local/bin/frogbot
          frogbot --version

      - name: Scan target repository
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

          JF_GIT_PROVIDER: github
          JF_GIT_API_ENDPOINT: https://api.github.com
          JF_GIT_TOKEN: ${{ secrets.JF_GIT_TOKEN }}
          JF_GIT_OWNER: ${{ github.repository_owner }}
          JF_GIT_REPO: ${{ matrix.target }}
          JF_GIT_BASE_BRANCH: ${{ inputs.branch || 'main' }}
        run: frogbot scan-repository
